# Gera os cartões de estatísticas (resumo, linguagens, commits) como SVG dentro do próprio repositório,
# sem depender de serviços externos. Saída: pasta profile-summary-card-output/

name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 18 * * *"   # todo dia às 15h (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -3
