# Gera os cartões de estatísticas (resumo, linguagens, commits) como SVG dentro do próprio repositório,
# sem depender de serviços externos. Saída: pasta profile-summary-card-output/

name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 18 * * *"   # todo dia às 15h (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -3
      - name: Cartão de estatísticas em roxo
        run: |
          mkdir -p cards
          cp profile-summary-card-output/github_dark/3-stats.svg cards/stats.svg
          sed -i 's/#0366d6/#ab7df8/g; s/#77909c/#8b949e/g' cards/stats.svg
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add cards
          if git commit -m "generated stats card"; then
            git pull --rebase origin main
            git push
          fi
