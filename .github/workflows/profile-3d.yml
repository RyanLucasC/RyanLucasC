# Salve este arquivo em: .github/workflows/profile-3d.yml
# (dentro do repositório RyanLucasC/RyanLucasC)
# Gera o gráfico 3D de contribuições usado na seção 08 do README.

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # atualiza todo dia às 15h (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated 3D contributions"; then
            git push
          fi
